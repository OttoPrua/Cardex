name: Validate
on:
  push:
    branches: [main, 'codex/release-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Go tests with the Kimi file-descriptor prerequisite
        run: |
          ulimit -n 65536
          go test ./... -count=1 -timeout=10m
      - run: go vet ./...
      - run: make test
      - run: python3 scripts/smoke.py bin/cardex
      - run: python3 scripts/test-install.py bin/cardex
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: cardex-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Require an unused version at the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const version = "\([^"]*\)"$/\1/p' cmd/cardex/main.go)
          test "$GITHUB_REF_NAME" = "v$version"
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$GITHUB_SHA" = "$main_sha"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" "$GITHUB_REF_NAME" <<'PY'
          import json, sys
          assert not any(r['tag_name'] == sys.argv[2] for page in json.load(open(sys.argv[1])) for r in page), 'release already exists'
          PY
          echo "CARDEX_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - run: python3 scripts/build-release.py
      - run: python3 scripts/verify-release.py "$CARDEX_RELEASE_VERSION" "$GITHUB_SHA"
      - name: Publish validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/release/"$CARDEX_RELEASE_VERSION"/* \
            --verify-tag --target "$GITHUB_SHA" --title "Cardex $GITHUB_REF_NAME" \
            --generate-notes --latest
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Native Windows lifecycle and onboarding
        run: go test ./cmd/cardex -run '^(TestWindows|TestExecutionLease|TestSetup|TestPreset|TestAcquireLockStealsAtomicallyNoDoubleOccupancy|TestDeniedPresemanticStartDoesNotConsumeResumeTombstone|TestReleaseLockRefusesForeignPID|TestExternalReviewDefaultFreezeRefusesHeldWriter|TestExternalReviewTempCLI|TestManualLocalIntegrationTempCLI|TestConfigurableDispatch)' -count=1 -timeout=180s -v
      - run: go vet ./...
      - run: go build -trimpath -o bin/cardex.exe ./cmd/cardex
      - name: CLI and board smoke
        run: python scripts/smoke.py bin/cardex.exe
      - name: Windows installer
        run: python scripts/test-install.py bin/cardex.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cardex-windows-amd64
          path: bin/cardex.exe
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Go tests with the Kimi file-descriptor prerequisite
        run: |
          sudo sysctl -w kern.maxfiles=262144 kern.maxfilesperproc=65536
          ulimit -n 65536
          go test ./... -count=1 -timeout=10m
      - run: go vet ./...
      - run: go build -trimpath -o bin/cardex ./cmd/cardex
      - run: python3 scripts/smoke.py bin/cardex
      - run: python3 scripts/test-install.py bin/cardex
