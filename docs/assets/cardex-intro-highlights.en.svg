<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">Seven highlights</title>
  <desc id="description">What Cardex does at a glance</desc>
