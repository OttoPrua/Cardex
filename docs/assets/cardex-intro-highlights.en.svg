  <text x="45" y="466" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="18" font-weight="570" fill="#45433E">macOS: system sandbox · Linux / Windows: supported, no sandbox</text>
