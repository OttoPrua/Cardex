name: Validate
on:
  push:
    branches: [main, 'codex/release-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Native Windows lifecycle and onboarding
        run: go test ./cmd/cardex -run '^(TestWindows|TestExecutionLease|TestSetup|TestPreset|TestAcquireLockStealsAtomicallyNoDoubleOccupancy|TestDeniedPresemanticStartDoesNotConsumeResumeTombstone|TestReleaseLockRefusesForeignPID)' -count=1 -timeout=180s -v
      - run: go vet ./...
      - run: go build -trimpath -o bin/cardex.exe ./cmd/cardex
      - name: CLI and board smoke
        run: python scripts/smoke.py bin/cardex.exe
      - name: Windows installer
        run: python scripts/test-install.py bin/cardex.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cardex-windows-amd64
          path: bin/cardex.exe
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Go tests with the Kimi file-descriptor prerequisite
        run: |
          sudo sysctl -w kern.maxfiles=262144 kern.maxfilesperproc=65536
          ulimit -n 65536
          go test ./... -count=1 -timeout=10m
      - run: go vet ./...
      - run: go build -trimpath -o bin/cardex ./cmd/cardex
      - run: python3 scripts/smoke.py bin/cardex
      - run: python3 scripts/test-install.py bin/cardex
