    <marker id="arrowWarm" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8L2 4Z" fill="#D9C38E"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="498" rx="25" fill="#F5F4EF" stroke="#DFDBCF"/>
  <rect x="946" y="22" width="209" height="118" rx="10" fill="url(#dots)" opacity=".71"/>
  <text x="1034" y="80" font-family="&quot;Geist Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="42" font-weight="600" fill="#C9C4B5">{{  }}</text>
  <text x="45" y="50" font-family="&quot;Geist Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="730" fill="#2F5BEA">CARDEX   /   HIGHLIGHTS</text>
  <text x="43" y="100" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="40" font-weight="750" fill="#16161A">Seven highlights</text>
  <text x="45" y="136" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="19" font-weight="480" fill="#45433E">What Cardex does at a glance</text>
  <rect x="44" y="166" width="266" height="108" rx="18" fill="#FFFEFA" stroke="#DFDBCF"/><rect x="58" y="202" width="238" height="2" fill="#2F5BEA"/>
  <text x="64" y="196" font-family="&quot;Geist Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#2F5BEA">01 / TOOLS</text>
  <text x="64" y="230" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="20" font-weight="730" fill="#16161A">Mix your tools</text>
  <text x="64" y="258" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="15.5" font-weight="490" fill="#45433E">Picked by difficulty and quota</text>
  <rect x="326" y="166" width="266" height="108" rx="18" fill="#FFFEFA" stroke="#DFDBCF"/><rect x="340" y="202" width="238" height="2" fill="#2F5BEA"/>
  <text x="346" y="196" font-family="&quot;Geist Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#2F5BEA">02 / PLAN</text>
  <text x="346" y="230" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="20" font-weight="730" fill="#16161A">It breaks work down</text>
  <text x="346" y="258" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="15.5" font-weight="490" fill="#45433E">You approve the direction</text>
  <rect x="608" y="166" width="266" height="108" rx="18" fill="#FFFEFA" stroke="#DFDBCF"/><rect x="622" y="202" width="238" height="2" fill="#2F5BEA"/>
  <text x="628" y="196" font-family="&quot;Geist Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#2F5BEA">03 / PARALLEL</text>
  <text x="628" y="230" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="20" font-weight="730" fill="#16161A">Parallel, no clashes</text>
  <text x="628" y="258" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="15.5" font-weight="490" fill="#45433E">One workspace per card</text>
  <rect x="890" y="166" width="266" height="108" rx="18" fill="#FFFEFA" stroke="#DFDBCF"/><rect x="1091" y="168" width="61" height="12" rx="4" fill="#22B8CF" stroke="#16161A" stroke-opacity="0.12"/><text x="1097" y="177" font-family="&quot;Geist Mono&quot;,ui-monospace,monospace" font-size="8" font-weight="700" fill="#16161A">TESTING</text><rect x="904" y="202" width="238" height="2" fill="#2F5BEA"/>
  <text x="910" y="196" font-family="&quot;Geist Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#137A4B">04 / VERIFY</text>
  <text x="910" y="230" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="20" font-weight="730" fill="#16161A">Test, then review</text>
  <text x="910" y="258" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="15.5" font-weight="490" fill="#45433E">Merged only if it passes</text>
  <rect x="44" y="290" width="360" height="108" rx="18" fill="#FFFEFA" stroke="#DFDBCF"/><rect x="58" y="326" width="332" height="2" fill="#2F5BEA"/>
  <text x="64" y="320" font-family="&quot;Geist Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#2F5BEA">05 / QUOTA</text>
  <text x="64" y="354" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="20" font-weight="730" fill="#16161A">No wasted quota</text>
  <text x="64" y="382" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="15.5" font-weight="490" fill="#45433E">Stops near limits, uses leftovers</text>
  <rect x="420" y="290" width="360" height="108" rx="18" fill="#FFFEFA" stroke="#D9C38E"/><rect x="701" y="292" width="75" height="12" rx="4" fill="#FF7AB6" stroke="#16161A" stroke-opacity="0.12"/><text x="707" y="301" font-family="&quot;Geist Mono&quot;,ui-monospace,monospace" font-size="8" font-weight="700" fill="#16161A">YOUR CALL</text><rect x="434" y="326" width="332" height="2" fill="#2F5BEA"/>
  <text x="440" y="320" font-family="&quot;Geist Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#C23A1E">06 / ASK</text>
  <text x="440" y="354" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="20" font-weight="730" fill="#16161A">Asks when it matters</text>
  <text x="440" y="382" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="15.5" font-weight="490" fill="#45433E">Silence is not a yes</text>
  <rect x="796" y="290" width="360" height="108" rx="18" fill="#FFFEFA" stroke="#DFDBCF"/><rect x="810" y="326" width="332" height="2" fill="#2F5BEA"/>
  <text x="816" y="320" font-family="&quot;Geist Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#2F5BEA">07 / LOCAL</text>
  <text x="816" y="354" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="20" font-weight="730" fill="#16161A">Stays local</text>
  <text x="816" y="382" font-family="&quot;Manrope&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Hiragino Sans GB&quot;,sans-serif" font-size="15.5" font-weight="490" fill="#45433E">Resumes after restarts</text>
